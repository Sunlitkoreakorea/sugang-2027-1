<title>2027-1 예비수강신청</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 블록 한 줄 = 시간표 한 칸. 왼쪽에 블록 코드, 오른쪽에 그 블록 과목 타일이 줄바꿈되며 깔림.
   넓은 화면은 오른쪽에 '내 시간표'가 따라오고, 좁은 화면은 아래 막대에서 펼친다. */
:root{
  --bg:#ffffff; --tile:#f3f3f1; --tile-hover:#e8e8e4; --line:#e3e2de;
  --fg:#151515; --muted:#73716b; --accent:#e03a2f;
  --a-korean:#ef6c00; --a-math:#1c7ed6; --a-english:#7950f2; --a-social:#a0692e; --a-science:#2f9e44;
  --a-foreign:#0b9aa8; --a-info:#d9a400; --a-art:#e64980; --a-research:#868e96;
  --sans:"Pretendard Variable",Pretendard,"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111211; --tile:#1d1e1c; --tile-hover:#272825; --line:#2c2d2a;
    --fg:#efefec; --muted:#9b998f; --accent:#ff5b4f;
    --a-korean:#ff922b; --a-math:#4dabf7; --a-english:#9775fa; --a-social:#c99a5b; --a-science:#51cf66;
    --a-foreign:#3bc9db; --a-info:#fcc419; --a-art:#f783ac; --a-research:#adb5bd;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111211; --tile:#1d1e1c; --tile-hover:#272825; --line:#2c2d2a;
  --fg:#efefec; --muted:#9b998f; --accent:#ff5b4f;
  --a-korean:#ff922b; --a-math:#4dabf7; --a-english:#9775fa; --a-social:#c99a5b; --a-science:#51cf66;
  --a-foreign:#3bc9db; --a-info:#fcc419; --a-art:#f783ac; --a-research:#adb5bd;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.wrap{max-width:1480px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 머리 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{padding-block:14px 12px;display:grid;gap:12px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h1 .yr{font-family:var(--mono);font-weight:600;letter-spacing:-.01em;margin-right:6px}
h1 .sub{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.seg{display:inline-flex;background:var(--tile);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tools{display:flex;gap:10px;align-items:center;min-width:0}
.search{flex:0 1 320px;display:flex;align-items:center;gap:8px;background:var(--tile);border-radius:10px;padding:0 12px;height:38px;min-width:0;color:var(--muted)}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--fg)}
.search svg{flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:inherit;font-size:14px;color:var(--fg);height:100%}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search .cnt{font-family:var(--mono);font-size:12px;white-space:nowrap}
.areas{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;padding-block:2px}
.areas::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--tile)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none}

/* 본문 */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start;padding-block:4px 56px}
.board{min-width:0}
.row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;padding-block:18px;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--hh,120px) + 8px)}
.row:last-child{border-bottom:0}
.code span{display:block;font-family:var(--mono);font-size:26px;font-weight:600;line-height:1;letter-spacing:-.02em}
.code small{display:block;margin-top:7px;font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:8px}
.tile{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm cr" "who also" "tags tags";gap:3px 10px;align-content:start;text-align:left;border:0;background:var(--tile);border-radius:10px;padding:11px 12px 10px;cursor:pointer;transition:background-color .12s,opacity .12s;outline:2px solid transparent;outline-offset:1px}
.tile:hover{background:var(--tile-hover)}
.tile:focus-visible{outline-color:var(--fg)}
.tile.same{outline-color:var(--ac)}
.nm{grid-area:nm;word-break:keep-all;overflow-wrap:anywhere;font-weight:600;font-size:14.5px;line-height:1.32;display:flex;gap:7px;align-items:baseline;min-width:0;letter-spacing:-.01em}
.nm .dot{transform:translateY(-1px)}
.cr{grid-area:cr;font-family:var(--mono);font-weight:600;font-size:14px;line-height:1.32;white-space:nowrap;font-variant-numeric:tabular-nums}
.cr small{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--muted);margin-left:1px}
.who{grid-area:who;word-break:keep-all;font-size:12.5px;color:var(--muted);padding-left:15px;min-width:0}
.also{grid-area:also;display:flex;gap:5px;justify-content:flex-end;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.also b{font-weight:500}
.also b.hit{color:var(--accent);font-weight:600}
.tags{grid-area:tags;display:flex;flex-wrap:wrap;gap:4px;padding-left:15px;margin-top:3px}
.tags em{font-style:normal;font-size:11px;line-height:1.55;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tile.on{background:var(--fg);color:var(--bg)}
.tile.on .who,.tile.on .also,.tile.on .cr small,.tile.on .tags em{color:inherit;opacity:.7}
.tile.on .tags em{border-color:currentColor}
.tags em.mix,.tile.on .tags em.mix{border-color:transparent;padding:0 2px}
.row.has-pick .tile:not(.on){opacity:.5}
.row.has-pick .tile:not(.on):hover,.row.has-pick .tile:not(.on):focus-visible{opacity:1}
.tile.taken,.row.has-pick .tile.taken{opacity:.3}
.tile.taken:hover{opacity:.85}
.empty{color:var(--muted);padding:48px 0;text-align:center}

/* 내 시간표 */
.mine{position:sticky;top:calc(var(--hh,120px) + 16px);margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--bg);max-height:calc(100dvh - var(--hh,120px) - 32px);overflow:auto}
.mine-bar{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:14px 16px;text-align:left;cursor:default}
.mine-t{font-weight:700;font-size:15px;white-space:nowrap}
.mine-dots{display:flex;gap:3px;flex:1;flex-wrap:wrap;min-width:0}
.mine-dots i{width:10px;height:10px;border-radius:3px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--line)}
.mine-dots i.on{background:var(--ac);box-shadow:none}
.mine-sum{font-size:13px;color:var(--muted);white-space:nowrap}
.mine-sum b{font-family:var(--mono);font-size:22px;color:var(--accent);font-weight:600;margin-right:2px;font-variant-numeric:tabular-nums}
.mine-list{list-style:none;margin:0;padding:6px 8px;border-top:1px solid var(--line)}
.mine-list button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:baseline;border:0;background:transparent;padding:8px;border-radius:8px;text-align:left;cursor:pointer}
.mine-list button:hover{background:var(--tile)}
.mb{font-family:var(--mono);font-weight:600;font-size:13px}
.mn{font-weight:600;min-width:0;line-height:1.35}
.mn small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.mine-list .none .mn{color:var(--muted);font-weight:400}
.mc{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.mine-act{display:flex;gap:8px;padding:6px 16px 16px}
.mine-act button{flex:1;height:36px;border-radius:9px;border:1px solid var(--line);background:transparent;font-weight:600;cursor:pointer}
.mine-act #copy{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mine-act #clear.arm{color:var(--accent);border-color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:999px;font-size:13px;font-weight:600;z-index:20;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}

@media (max-width:999px){
  .layout{grid-template-columns:minmax(0,1fr);padding-bottom:calc(var(--bh,64px) + 32px)}
  .mine{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;border-radius:16px 16px 0 0;border-width:1px 0 0;max-height:78dvh;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 28px rgb(0 0 0 / .1)}
  .mine-bar{cursor:pointer;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mine-bar::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(-45deg) translate(-2px,2px);flex:none;margin-left:2px}
  .mine.open .mine-bar::after{transform:rotate(135deg) translate(-2px,2px)}
  .mine-body{display:none}
  .mine.open .mine-body{display:block}
  .mine-list{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .mine-act{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .toast{bottom:calc(var(--bh,64px) + 12px)}
}
@media (max-width:640px){
  .tools{flex-direction:column;align-items:stretch}
  .search{flex:none}
  .row{grid-template-columns:minmax(0,1fr);gap:10px;padding-block:14px}
  .code{display:flex;align-items:baseline;gap:8px}
  .code span{font-size:22px}
  .code small{margin:0}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .tile{padding:10px 10px 9px}
  .nm{font-size:14px}
  .tile{grid-template-areas:"nm nm" "who cr" "also also" "tags tags"}
  .cr{align-self:baseline}
  .also{justify-content:flex-start;padding-left:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top" id="top">
  <div class="wrap top-in">
    <div class="title-row">
      <h1><span class="yr">2027-1</span>예비수강신청<span class="sub">1차 목록</span></h1>
      <div class="seg" role="tablist" id="grades">
        <button role="tab" id="g1" data-g="1">1학년</button>
        <button role="tab" id="g2" data-g="2">2학년</button>
        <button role="tab" id="g3" data-g="3">3학년</button>
      </div>
    </div>
    <div class="tools">
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="과목, 선생님" autocomplete="off" spellcheck="false">
        <span class="cnt" id="cnt"></span>
      </label>
      <div class="areas" id="areas"></div>
    </div>
  </div>
</header>

<main class="wrap layout">
  <section class="board" id="board" aria-live="polite"></section>
  <aside class="mine" id="mine">
    <button class="mine-bar" id="mineBar" aria-expanded="false" aria-controls="mineBody">
      <span class="mine-t">내 시간표</span>
      <span class="mine-dots" id="mineDots"></span>
      <span class="mine-sum"><b id="sum">0</b>학점</span>
    </button>
    <div class="mine-body" id="mineBody">
      <ol class="mine-list" id="mineList"></ol>
      <div class="mine-act">
        <button id="copy" type="button">복사</button>
        <button id="clear" type="button">비우기</button>
      </div>
    </div>
  </aside>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const DATA = /*DATA*/null/*END*/;

const AREAS = [['korean','국어'],['math','수학'],['english','영어'],['social','사회'],['science','과학'],
               ['foreign','외국어'],['info','정보'],['art','예체능'],['research','탐구']];
const AREA_IDX = Object.fromEntries(AREAS.map(([k], i) => [k, i]));
const KEY = 'sugang-2027-1/v1';

const ROWS = DATA.rows.map((r, i) => ({ ...r, id: i, k: r.n, sig: r.b + '|' + r.n + '|' + r.t.join(',') }));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function blockSort(a, b) {
  const [, la, na] = a.match(/^([A-Z]+)(\d*)$/) || [, a, ''];
  const [, lb, nb] = b.match(/^([A-Z]+)(\d*)$/) || [, b, ''];
  return la.localeCompare(lb) || (+na || 0) - (+nb || 0);
}

// 학년별 화면 자료 (블록 → 과목들), 서명 → 행
const VIEW = {}, SIG = {};
for (const g of [1, 2, 3]) {
  const map = new Map();
  SIG[g] = new Map();
  for (const r of ROWS) {
    if (!r.g.includes(g)) continue;
    if (!map.has(r.b)) map.set(r.b, []);
    map.get(r.b).push(r);
    SIG[g].set(r.sig, r);
  }
  VIEW[g] = [...map.keys()].sort(blockSort).map(b => ({
    b, rows: map.get(b).sort((x, y) => AREA_IDX[x.a] - AREA_IDX[y.a] || x.id - y.id)
  }));
}

const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }
};
const S = Object.assign({ grade: 3, picks: {} }, store.get() || {});
if (![1, 2, 3].includes(S.grade)) S.grade = 3;
const fromHash = () => { const m = location.hash.match(/^#g([123])$/); return m ? +m[1] : null; };
if (fromHash()) S.grade = fromHash();
let q = '', area = null, hoverK = null;
const save = () => store.set(S);

function picksFor(g) {
  if (!S.picks[g]) {            // 처음 여는 학년: 과목이 하나뿐인 블록은 미리 채움
    const p = {};
    for (const blk of VIEW[g]) if (blk.rows.length === 1) p[blk.b] = blk.rows[0].sig;
    S.picks[g] = p;
  }
  const p = S.picks[g];
  for (const b in p) { const r = SIG[g].get(p[b]); if (!r || r.b !== b) delete p[b]; }
  return p;
}

function matches(r, words) {
  if (area && r.a !== area) return false;
  if (!words.length) return true;
  const hay = (r.n + ' ' + r.t.join(' ') + ' ' + r.x.map(x => x[0]).join(' ')).toLowerCase();
  return words.every(w => hay.includes(w));
}

function tileHTML(r, blkB, picked, takenAt, offered) {
  const on = picked[blkB] === r;
  const tb = takenAt[r.k];
  const taken = !on && tb && tb !== blkB;
  const also = [...offered[r.k]].filter(b => b !== blkB).sort(blockSort);
  const tags = r.x.map(([s, full]) => `<em title="${esc(full)}">${esc(s)}</em>`);
  if (r.g.length > 1) tags.push(`<em class="mix">${r.g.join(',')}학년</em>`);
  return `<button class="tile${on ? ' on' : ''}${taken ? ' taken' : ''}" type="button" data-sig="${esc(r.sig)}" data-k="${esc(r.k)}" style="--ac:var(--a-${r.a})" aria-pressed="${on}">`
    + `<span class="nm"><i class="dot"></i>${esc(r.n)}</span>`
    + `<span class="cr">${r.c}<small>학점</small></span>`
    + `<span class="who">${esc(r.t.join(', '))}</span>`
    + (also.length ? `<span class="also" title="다른 블록에도 열림">${also.map(b => `<b${tb === b ? ' class="hit"' : ''}>${b}</b>`).join('')}</span>` : '')
    + (tags.length ? `<span class="tags">${tags.join('')}</span>` : '')
    + `</button>`;
}

function render() {
  const g = S.grade, blocks = VIEW[g], p = picksFor(g);
  for (const b of $('grades').children) b.setAttribute('aria-selected', String(+b.dataset.g === g));

  const picked = {}, takenAt = {}, offered = {};
  for (const b in p) { const r = SIG[g].get(p[b]); picked[b] = r; takenAt[r.k] = b; }
  for (const blk of blocks) for (const r of blk.rows) (offered[r.k] ||= new Set()).add(blk.b);

  // 분야 칩: 이 학년에 있는 분야만
  const present = new Set(blocks.flatMap(blk => blk.rows.map(r => r.a)));
  if (area && !present.has(area)) area = null;
  $('areas').innerHTML = AREAS.filter(([k]) => present.has(k)).map(([k, n]) =>
    `<button class="chip" type="button" data-a="${k}" aria-pressed="${area === k}" style="--ac:var(--a-${k})"><i class="dot"></i>${n}</button>`).join('');

  const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0, total = 0;
  const html = blocks.map(blk => {
    total += blk.rows.length;
    const tiles = blk.rows.filter(r => matches(r, words)).map(r => tileHTML(r, blk.b, picked, takenAt, offered));
    shown += tiles.length;
    if (!tiles.length) return '';
    return `<div class="row${picked[blk.b] ? ' has-pick' : ''}" id="blk-${blk.b}">`
      + `<div class="code"><span>${blk.b}</span><small>${blk.rows.length}과목</small></div>`
      + `<div class="tiles">${tiles.join('')}</div></div>`;
  }).join('');
  $('board').innerHTML = html || `<p class="empty">맞는 과목이 없어요</p>`;
  $('cnt').textContent = (words.length || area) ? `${shown}/${total}` : '';
  hoverK = null;

  // 내 시간표
  let sum = 0;
  $('mineList').innerHTML = blocks.map(blk => {
    const r = picked[blk.b];
    if (r) sum += r.c;
    return `<li><button type="button" data-b="${blk.b}" class="${r ? '' : 'none'}">`
      + `<span class="mb">${blk.b}</span>`
      + `<span class="mn">${r ? esc(r.n) + `<small>${esc(r.t.join(', '))}</small>` : '—'}</span>`
      + `<span class="mc">${r ? r.c : ''}</span></button></li>`;
  }).join('');
  $('mineDots').innerHTML = blocks.map(blk => {
    const r = picked[blk.b];
    return r ? `<i class="on" style="--ac:var(--a-${r.a})" title="${blk.b}"></i>` : `<i title="${blk.b}"></i>`;
  }).join('');
  $('sum').textContent = sum;
}

let toastT;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200);
}

// 과목 고르기
$('board').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const g = S.grade, p = picksFor(g), r = SIG[g].get(t.dataset.sig); if (!r) return;
  if (p[r.b] === r.sig) delete p[r.b];
  else {
    for (const ob in p) {
      const pr = SIG[g].get(p[ob]);
      if (ob !== r.b && pr && pr.k === r.k) { delete p[ob]; toast(`${r.n}  ${ob} → ${r.b}`); }
    }
    p[r.b] = r.sig;
  }
  save(); render();
  const again = $('board').querySelector(`.tile[data-sig="${CSS.escape(r.sig)}"]`);
  if (again) again.focus({ preventScroll: true });
});

// 같은 과목이 열리는 다른 블록 함께 표시
$('board').addEventListener('mouseover', e => {
  const t = e.target.closest('.tile'), k = t ? t.dataset.k : null;
  if (k === hoverK) return;
  hoverK = k;
  $('board').querySelectorAll('.tile.same').forEach(x => x.classList.remove('same'));
  if (!k) return;
  const list = $('board').querySelectorAll(`.tile[data-k="${CSS.escape(k)}"]`);
  if (list.length > 1) list.forEach(x => x.classList.add('same'));
});
$('board').addEventListener('mouseleave', () => {
  hoverK = null;
  $('board').querySelectorAll('.tile.same').forEach(x => x.classList.remove('same'));
});

// 학년
function setGrade(g) {
  if (S.grade === g) return;
  S.grade = g; save();
  try { history.replaceState(null, '', '#g' + g); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
$('grades').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setGrade(+b.dataset.g); });
window.addEventListener('hashchange', () => { const g = fromHash(); if (g) setGrade(g); });

// 검색, 분야
$('q').addEventListener('input', e => { q = e.target.value; render(); });
$('q').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = q = ''; render(); } });
$('areas').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  area = area === c.dataset.a ? null : c.dataset.a; render();
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); }
});

// 내 시간표: 펼치기(좁은 화면), 블록으로 이동, 복사, 비우기
const narrow = matchMedia('(max-width: 999px)');
$('mineBar').addEventListener('click', () => {
  if (!narrow.matches) return;
  const open = $('mine').classList.toggle('open');
  $('mineBar').setAttribute('aria-expanded', String(open));
});
$('mineList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  let row = $('blk-' + b.dataset.b);
  if (!row) { q = ''; $('q').value = ''; area = null; render(); row = $('blk-' + b.dataset.b); }
  if (narrow.matches) { $('mine').classList.remove('open'); $('mineBar').setAttribute('aria-expanded', 'false'); }
  if (row) row.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
});
$('copy').addEventListener('click', () => {
  const g = S.grade, p = picksFor(g);
  let sum = 0;
  const lines = VIEW[g].map(blk => {
    const r = SIG[g].get(p[blk.b]);
    if (!r) return `${blk.b}\t-`;
    sum += r.c;
    return `${blk.b}\t${r.n}\t${r.t.join(', ')}\t${r.c}학점`;
  });
  const text = `${DATA.year}-${DATA.term} ${g}학년 예비수강신청\n${lines.join('\n')}\n합계 ${sum}학점`;
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); toast(ok ? '복사했어요' : '복사가 막혀 있어요');
  };
  try { navigator.clipboard.writeText(text).then(() => toast('복사했어요'), fallback); } catch (e) { fallback(); }
});
let armT;
$('clear').addEventListener('click', e => {
  const btn = e.currentTarget;
  if (!btn.classList.contains('arm')) {
    btn.classList.add('arm'); btn.textContent = '한 번 더';
    clearTimeout(armT); armT = setTimeout(() => { btn.classList.remove('arm'); btn.textContent = '비우기'; }, 2500);
    return;
  }
  clearTimeout(armT); btn.classList.remove('arm'); btn.textContent = '비우기';
  delete S.picks[S.grade]; save(); render(); toast('비웠어요');
});

// 머리, 아래 막대 높이 → 스크롤 여백
const ro = new ResizeObserver(() => {
  document.documentElement.style.setProperty('--hh', $('top').offsetHeight + 'px');
  document.documentElement.style.setProperty('--bh', $('mineBar').offsetHeight + 'px');
});
ro.observe($('top')); ro.observe($('mineBar'));

render();
</script>
